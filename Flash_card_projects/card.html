<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashCard learning App</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>
    <header>
        <h1>Flash Card learning App</h1>
        <p>Learn with card, enhance your knowledge</p>
    </header>

    <main>
        <section class="flashcard-container">

            <p id="card-container">card 1 of 3</p>

            <div class="flashcard">
                <h id="question">Your question will appear here</h>

                <p id="answer" hidden>Your answer will appear here</p>
            </div>
            <div class="card-actions">
                <button id="show-answer-btn" type="button">Show answer</button>
            </div>

            <div class="navigation">
                <button id="prev-btn" type="button" disabled>Previous</button>

                <button id="next-btn" type="button">Next</button>
            </div>
        </section>
    </main>

    <footer>
        <p>Keep Learning keep Growing</p>
    </footer>

    <script src="card.js"></script>
     
    
</body>
</html
